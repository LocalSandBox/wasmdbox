name: Cancellation lifecycle diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Reproduce cold cancellation and capture worker stacks
        env:
          WASMDBOX_RUNTIME_ORDER_REPORT: ${{ github.workspace }}/.artifacts/cancel-order.jsonl
          WASMDBOX_RUNTIME_CPU_DIRECTORY: ${{ github.workspace }}/.artifacts/cancel-profiles
        run: |
          mkdir -p .artifacts/cancel-profiles
          node --import ./tests/fixtures/runtime-order-observer.mjs tests/fixtures/cancel-cycle-repro.mjs 100
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cancellation-${{ matrix.os }}
          path: |
            .artifacts/cancel-order.jsonl
            .artifacts/cancel-cycle-results.json
            .artifacts/cancel-profiles/*.cpuprofile
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
