name: Close lifecycle probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts && npm run build
      - run: |
          for mode in ordinary client-only deferred; do
            WASMDBOX_CLOSE_PROBE=$mode node --import ./tests/fixtures/close-order-loader.mjs ./tests/fixtures/close-order-probe.mjs || true
          done
