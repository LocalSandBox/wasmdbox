name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - name: Build and test
        run: |
          npm run build
          node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run typecheck
      - name: Run standalone examples
        run: npm run demo
      - name: Run preparation, extra-package, installation and public HTTPS examples
        run: |
          node examples/prepare/main.js
          node examples/extra-packages/main.js
          npm run demo:install
          npm run test:proxy:online
      - name: Verify the installable package
        run: npm run test:package
      - name: Run SDK patch ablations
        if: runner.os == 'Linux'
        run: |
          npm run test:ablation
          node scripts/ablation-parent-deadline.mjs
      - name: Upload the verified npm package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: |
            .artifacts/npm/*.tgz
            .artifacts/package-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-${{ matrix.os }}
          path: |
            .artifacts/package-verification.json
            .artifacts/ablation/results.json
            .artifacts/ablation/public-parent-deadline/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows runtime
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - name: Test packages, networking, secrets and release validation
        run: node --test --test-concurrency=1 tests/prepare.test.mjs tests/proxy.test.mjs tests/proxy-sdk.test.mjs tests/secrets.test.mjs tests/release.test.mjs
      - name: Run all numbered examples
        run: npm run demo
      - name: Run preparation, extra-package, installation and public HTTPS examples
        run: |
          node examples/prepare/main.js
          node examples/extra-packages/main.js
          npm run demo:install
          npm run test:proxy:online
      - name: Verify the installed package on Windows
        run: npm run test:package
      - name: Upload Windows validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-windows
          path: .artifacts/package-verification.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
