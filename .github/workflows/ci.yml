name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - name: Build and test
        run: npm test
      - run: npm run typecheck
      - name: Run standalone examples
        run: npm run demo
      - name: Verify the installable package
        run: npm run test:package
      - name: Run SDK patch ablations
        if: runner.os == 'Linux'
        run: |
          npm run test:ablation
          node scripts/ablation-parent-deadline.mjs
      - name: Upload the verified npm package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: |
            .artifacts/npm/*.tgz
            .artifacts/package-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-${{ matrix.os }}
          path: |
            .artifacts/package-verification.json
            .artifacts/ablation/results.json
            .artifacts/ablation/public-parent-deadline/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
